name: Daily BookWalker First Volume Update

on:
  schedule:
    # 毎日 JST 午前3:00 (UTC 18:00) に自動実行
    - cron: '0 18 * * *'
  workflow_dispatch: # 手動実行ボタン（動作確認用）

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas selenium
          
      - name: Install dependencies
        run: pip install pandas requests
        
      - name: Run script
        run: python build.py

      # 新しいシリーズ履歴(series_history.json)を自動コミットしてGitHubに保存
      - name: Commit & Push updated history
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add series_history.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update series history" && git push)

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
