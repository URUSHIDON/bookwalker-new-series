name: Update BookWalker New Series Data

on:
  schedule:
    # JST 午前3:00 (UTC 18:00)
    - cron: '0 18 * * *'
  workflow_dispatch: # 手動実行ボタンも残しておくのがおすすめ

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas

      - name: Run build script
        timeout-minutes: 15
        run: python build.py

      - name: Commit and Push generated files
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.json months.json series_history.json cover_cache.json last_updated.json
          git diff --quiet && git diff --staged --quiet || git commit -m "Auto update generated data [skip ci]"
          git push
