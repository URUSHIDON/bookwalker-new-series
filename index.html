<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>新刊マンガ・新シリーズ一覧</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      max-width: 1200px;
      margin: 0 auto;
      padding: 20px;
      background-color: #f8f9fa;
      color: #333;
    }
    h1 {
      font-size: 1.5rem;
      margin-bottom: 12px;
    }
    .month-tabs {
      display: flex;
      gap: 8px;
      margin-bottom: 6px;
      flex-wrap: wrap;
    }
    .tab-btn {
      padding: 8px 16px;
      border: 1px solid #ccc;
      background: #fff;
      cursor: pointer;
      border-radius: 4px;
      font-weight: bold;
    }
    .tab-btn.active {
      background: #007bff;
      color: #fff;
      border-color: #007bff;
    }
    .update-time {
      font-size: 0.85rem;
      color: #666;
      margin-bottom: 20px;
    }
    .item-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 16px;
    }
    .item-card {
      background: #fff;
      border: 1px solid #e0e0e0;
      border-radius: 6px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }
    .item-img {
      width: 100%;
      height: 280px;
      object-fit: cover;
      background-color: #f0f0f0;
    }
    .item-body {
      padding: 12px;
      display: flex;
      flex-direction: column;
      flex-grow: 1;
    }
    .item-date {
      font-size: 0.8rem;
      color: #888;
      margin-bottom: 4px;
    }
    .item-title {
      font-size: 0.95rem;
      font-weight: bold;
      margin-bottom: 8px;
      line-height: 1.3;
      text-decoration: none;
      color: #007bff;
    }
    .item-title:hover {
      text-decoration: underline;
    }
    .badge-new {
      display: inline-block;
      background-color: #dc3545;
      color: #fff;
      font-size: 0.7rem;
      padding: 2px 6px;
      border-radius: 3px;
      margin-bottom: 6px;
      align-self: flex-start;
    }
    .item-meta {
      font-size: 0.8rem;
      color: #666;
      margin-top: auto;
    }
  </style>
</head>
<body>

  <h1>新刊マンガ 1巻・新シリーズ一覧</h1>

  <!-- 月選択タブ -->
  <div id="month-tabs" class="month-tabs"></div>

  <!-- データ更新日時の表示領域 -->
  <div id="update-time" class="update-time">データ更新日時：読み込み中...</div>

  <!-- カード一覧表示領域 -->
  <div id="item-grid" class="item-grid"></div>

  <script>
    let allData = {};

    async function init() {
      try {
        // 更新日時の読み込み
        loadUpdateTime();

        // 表示月リストの取得
        const monthsRes = await fetch('months.json');
        const months = await monthsRes.json();

        // メインデータの取得
        const dataRes = await fetch('data.json');
        allData = await dataRes.json();

        if (months.length > 0) {
          renderTabs(months);
          renderItems(months[0]); // 最新月を表示
        } else {
          document.getElementById('item-grid').innerHTML = '<p>表示できるデータがありません。</p>';
        }
      } catch (err) {
        console.error('データ読み込みエラー:', err);
        document.getElementById('item-grid').innerHTML = '<p>データの読み込みに失敗しました。</p>';
      }
    }

    async function loadUpdateTime() {
      try {
        const res = await fetch('last_updated.json');
        if (!res.ok) throw new Error();
        const data = await res.json();
        document.getElementById('update-time').textContent = `データ更新日時：${data.updated_at}`;
      } catch {
        document.getElementById('update-time').textContent = '';
      }
    }

    function renderTabs(months) {
      const container = document.getElementById('month-tabs');
      container.innerHTML = '';

      months.forEach((m, index) => {
        const btn = document.createElement('button');
        btn.className = `tab-btn ${index === 0 ? 'active' : ''}`;
        btn.textContent = m;
        btn.onclick = () => {
          document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
          renderItems(m);
        };
        container.appendChild(btn);
      });
    }

    function renderItems(month) {
      const container = document.getElementById('item-grid');
      container.innerHTML = '';

      const items = allData[month] || [];
      if (items.length === 0) {
        container.innerHTML = '<p>この月の対象アイテムはありません。</p>';
        return;
      }

      items.forEach(item => {
        const card = document.createElement('div');
        card.className = 'item-card';

        const imgSrc = item.image || 'https://via.placeholder.com/200x280?text=No+Image';

        card.innerHTML = `
          <img src="${imgSrc}" class="item-img" alt="${item.title}" loading="lazy">
          <div class="item-body">
            <div class="item-date">${item.release_date} 発売</div>
            ${item.is_new_series ? '<span class="badge-new">新シリーズ</span>' : ''}
            <a href="${item.url}" target="_blank" rel="noopener" class="item-title">${item.title}</a>
            <div class="item-meta">
              <div>${item.publisher}</div>
              <div>${item.price ? item.price + '円' : ''}</div>
            </div>
          </div>
        `;
        container.appendChild(card);
      });
    }

    document.addEventListener('DOMContentLoaded', init);
  </script>
</body>
</html>
