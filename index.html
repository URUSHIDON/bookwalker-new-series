<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BOOK☆WALKER 1巻・新シリーズ新刊カレンダー</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background-color: #f5f6f8;
      color: #333;
      margin: 0;
      padding: 20px;
    }
    header {
      max-width: 1200px;
      margin: 0 auto 20px auto;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 15px;
      background: #fff;
      padding: 15px 20px;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.05);
    }
    h1 {
      font-size: 1.4rem;
      margin: 0;
    }
    .selector-container {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    select {
      font-size: 1rem;
      padding: 8px 12px;
      border-radius: 6px;
      border: 1px solid #ccc;
      background-color: #fff;
      cursor: pointer;
    }
    #container {
      max-width: 1200px;
      margin: 0 auto;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
      gap: 15px;
    }
    .card {
      background: #fff;
      border-radius: 8px;
      overflow: hidden;
      box-shadow: 0 2px 5px rgba(0,0,0,0.05);
      display: flex;
      flex-direction: column;
      transition: transform 0.2s;
    }
    .card:hover {
      transform: translateY(-3px);
    }
    .card img {
      width: 100%;
      height: 220px;
      object-fit: cover;
      background-color: #eee;
    }
    .card-body {
      padding: 10px;
      display: flex;
      flex-direction: column;
      flex-grow: 1;
    }
    .badge {
      font-size: 0.7rem;
      font-weight: bold;
      color: #fff;
      background-color: #ff4757;
      padding: 2px 6px;
      border-radius: 4px;
      align-self: flex-start;
      margin-bottom: 5px;
    }
    .date {
      font-size: 0.75rem;
      color: #666;
      margin-bottom: 4px;
    }
    .title {
      font-size: 0.85rem;
      font-weight: bold;
      line-height: 1.3;
      margin-bottom: 8px;
      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .title a {
      color: #2f3542;
      text-decoration: none;
    }
    .title a:hover {
      text-decoration: underline;
    }
    .publisher {
      font-size: 0.7rem;
      color: #888;
      margin-top: auto;
    }
    .empty-msg {
      text-align: center;
      padding: 40px;
      color: #666;
    }
  </style>
</head>
<body>

  <header>
    <h1>BOOK☆WALKER 1巻・新着カレンダー</h1>
    <div class="selector-container">
      <label for="month-select">表示月:</label>
      <select id="month-select">
        <option value="">読み込み中...</option>
      </select>
    </div>
  </header>

  <main id="container">
    <div id="book-grid" class="grid"></div>
  </main>

  <script>
    let allData = {};

    async function init() {
      try {
        const response = await fetch('data.json');
        allData = await response.json();
        
        const months = Object.keys(allData).sort().reverse();
        const selectEl = document.getElementById('month-select');
        selectEl.innerHTML = '';

        if (months.length === 0) {
          selectEl.innerHTML = '<option>データなし</option>';
          return;
        }

        months.forEach(m => {
          const opt = document.createElement('option');
          opt.value = m;
          opt.textContent = m.replace('-', '年 ') + '月';
          selectEl.appendChild(opt);
        });

        // 今月（または最新月）を初期選択
        const currentMonth = new Date().toISOString().slice(0, 7);
        const defaultMonth = months.includes(currentMonth) ? currentMonth : months[0];
        selectEl.value = defaultMonth;

        renderMonth(defaultMonth);

        selectEl.addEventListener('change', (e) => {
          renderMonth(e.target.value);
        });

      } catch (err) {
        console.error(err);
        document.getElementById('container').innerHTML = '<div class="empty-msg">データの読み込みに失敗しました。</div>';
      }
    }

    function renderMonth(month) {
      const grid = document.getElementById('book-grid');
      grid.innerHTML = '';

      const items = allData[month] || [];
      if (items.length === 0) {
        grid.innerHTML = '<div class="empty-msg">この月のデータはありません。</div>';
        return;
      }

      items.forEach(item => {
        const card = document.createElement('div');
        card.className = 'card';

        const imgUrl = item.image || 'https://via.placeholder.com/150x210?text=No+Image';
        const isNew = item.is_new_series ? '<span class="badge">新シリーズ</span>' : '';

        card.innerHTML = `
          <a href="${item.url}" target="_blank" rel="noopener">
            <img src="${imgUrl}" alt="${item.title}" loading="lazy">
          </a>
          <div class="card-body">
            ${isNew}
            <div class="date">${item.release_date}</div>
            <div class="title">
              <a href="${item.url}" target="_blank" rel="noopener">${item.title}</a>
            </div>
            <div class="publisher">${item.publisher || ''}</div>
          </div>
        `;
        grid.appendChild(card);
      });
    }

    init();
  </script>
</body>
</html>
