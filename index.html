<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BOOK☆WALKER 1巻・新シリーズ新刊カレンダー</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background-color: #f5f6f8;
      color: #333;
      margin: 0;
      padding: 20px;
    }
    header {
      max-width: 1200px;
      margin: 0 auto 20px auto;
      background: #fff;
      padding: 15px 20px;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.05);
    }
    .top-bar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 15px;
    }
    h1 {
      font-size: 1.4rem;
      margin: 0;
    }
    .selector-container {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    select {
      font-size: 1rem;
      padding: 8px 12px;
      border-radius: 6px;
      border: 1px solid #ccc;
      background-color: #fff;
      cursor: pointer;
    }
    .filter-container {
      margin-top: 15px;
      padding-top: 12px;
      border-top: 1px solid #eee;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 15px;
      font-size: 0.85rem;
    }
    .filter-title {
      font-weight: bold;
      color: #555;
    }
    .filter-item {
      display: flex;
      align-items: center;
      gap: 5px;
      cursor: pointer;
      user-select: none;
    }
    #container {
      max-width: 1200px;
      margin: 0 auto;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
      gap: 15px;
    }
    .card {
      background: #fff;
      border-radius: 8px;
      overflow: hidden;
      box-shadow: 0 2px 5px rgba(0,0,0,0.05);
      display: flex;
      flex-direction: column;
      transition: transform 0.2s;
    }
    .card:hover {
      transform: translateY(-3px);
    }
    .card img {
      width: 100%;
      height: 220px;
      object-fit: cover;
      background-color: #eee;
    }
    .card-body {
      padding: 10px;
      display: flex;
      flex-direction: column;
      flex-grow: 1;
    }
    .badge-container {
      display: flex;
      gap: 4px;
      flex-wrap: wrap;
      margin-bottom: 5px;
    }
    .badge {
      font-size: 0.65rem;
      font-weight: bold;
      color: #fff;
      background-color: #ff4757;
      padding: 2px 6px;
      border-radius: 4px;
    }
    .cat-badge {
      font-size: 0.65rem;
      color: #555;
      background-color: #eccc68;
      padding: 2px 6px;
      border-radius: 4px;
    }
    .date {
      font-size: 0.75rem;
      color: #666;
      margin-bottom: 4px;
    }
    .title {
      font-size: 0.85rem;
      font-weight: bold;
      line-height: 1.3;
      margin-bottom: 8px;
      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .title a {
      color: #2f3542;
      text-decoration: none;
    }
    .title a:hover {
      text-decoration: underline;
    }
    .publisher {
      font-size: 0.7rem;
      color: #888;
      margin-top: auto;
    }
    .empty-msg {
      text-align: center;
      padding: 40px;
      color: #666;
    }
  </style>
</head>
<body>

  <header>
    <div class="top-bar">
      <h1>BOOK☆WALKER 1巻・新着カレンダー</h1>
      <div class="selector-container">
        <label for="month-select">表示月:</label>
        <select id="month-select">
          <option value="">読み込み中...</option>
        </select>
      </div>
    </div>
    <div class="filter-container">
      <span class="filter-title">カテゴリ絞り込み:</span>
      <div id="category-filters" style="display: flex; gap: 12px; flex-wrap: wrap;"></div>
    </div>
  </header>

  <main id="container">
    <div id="book-grid" class="grid"></div>
  </main>

  <script>
    let allData = {};
    let activeCategories = new Set();

    function cleanUrl(rawUrl) {
      if (!rawUrl) return "#";
      let url = rawUrl.trim();
      if (url.startsWith("http://")) {
        url = url.replace("http://", "https://");
      }
      return url;
    }

    async function init() {
      try {
        const response = await fetch('data.json');
        allData = await response.json();
        
        const months = Object.keys(allData).sort().reverse();
        const selectEl = document.getElementById('month-select');
        selectEl.innerHTML = '';

        if (months.length === 0) {
          selectEl.innerHTML = '<option>データなし</option>';
          return;
        }

        months.forEach(m => {
          const opt = document.createElement('option');
          opt.value = m;
          opt.textContent = m.replace('-', '年 ') + '月';
          selectEl.appendChild(opt);
        });

        const currentMonth = new Date().toISOString().slice(0, 7);
        const defaultMonth = months.includes(currentMonth) ? currentMonth : months[0];
        selectEl.value = defaultMonth;

        setupCategoryFilters();
        renderMonth(defaultMonth);

        selectEl.addEventListener('change', (e) => {
          renderMonth(e.target.value);
        });

      } catch (err) {
        console.error(err);
        document.getElementById('container').innerHTML = '<div class="empty-msg">データの読み込みに失敗しました。</div>';
      }
    }

    function setupCategoryFilters() {
      const categories = new Set();
      Object.values(allData).forEach(monthItems => {
        monthItems.forEach(item => {
          if (item.category) categories.add(item.category);
        });
      });

      activeCategories = new Set(categories);
      const container = document.getElementById('category-filters');
      container.innerHTML = '';

      categories.forEach(cat => {
        const label = document.createElement('label');
        label.className = 'filter-item';
        
        const checkbox = document.createElement('input');
        checkbox.type = 'checkbox';
        checkbox.value = cat;
        checkbox.checked = true;

        checkbox.addEventListener('change', (e) => {
          if (e.target.checked) {
            activeCategories.add(cat);
          } else {
            activeCategories.delete(cat);
          }
          const currentMonth = document.getElementById('month-select').value;
          renderMonth(currentMonth);
        });

        label.appendChild(checkbox);
        label.appendChild(document.createTextNode(cat));
        container.appendChild(label);
      });
    }

    function renderMonth(month) {
      const grid = document.getElementById('book-grid');
      grid.innerHTML = '';

      const items = allData[month] || [];
      const filteredItems = items.filter(item => activeCategories.has(item.category));

      if (filteredItems.length === 0) {
        grid.innerHTML = '<div class="empty-msg">該当する作品がありません。</div>';
        return;
      }

      filteredItems.forEach(item => {
        const card = document.createElement('div');
        card.className = 'card';

        const targetUrl = cleanUrl(item.url);
        const imgUrl = item.image ? item.image : 'https://via.placeholder.com/150x210?text=No+Image';
        const isNew = item.is_new_series ? '<span class="badge">新シリーズ</span>' : '';
        const catBadge = item.category ? `<span class="cat-badge">${item.category}</span>` : '';

        card.innerHTML = `
          <a href="${targetUrl}" target="_blank" rel="noopener noreferrer">
            <img src="${imgUrl}" alt="${item.title}" loading="lazy" onerror="this.src='https://via.placeholder.com/150x210?text=No+Image'">
          </a>
          <div class="card-body">
            <div class="badge-container">
              ${isNew}
              ${catBadge}
            </div>
            <div class="date">${item.release_date}</div>
            <div class="title">
              <a href="${targetUrl}" target="_blank" rel="noopener noreferrer">${item.title}</a>
            </div>
            <div class="publisher">${item.publisher || ''}</div>
          </div>
        `;
        grid.appendChild(card);
      });
    }

    init();
  </script>
</body>
</html>
